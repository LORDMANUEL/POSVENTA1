name: Stable Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stable-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  # Every release-candidate SHA owns an independent proof. It neither cancels
  # nor waits behind an obsolete SHA from the same stabilization branch.
  cancel-in-progress: false

jobs:
  stable_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated stable environment
        run: |
          cp .env.example .env
          sed -i 's/change-this-in-production/stable-e2e-db-password/g' .env
          sed -i 's/change-this-to-a-long-random-secret/stable-e2e-jwt-secret-at-least-32-chars/g' .env
          sed -i 's/change-this-bootstrap-token/stable-e2e-bootstrap-token/g' .env
          sed -i 's/^MZ_SITE_ADDRESS=.*/MZ_SITE_ADDRESS=:80/' .env
      - name: Build and start stable stack
        run: docker compose up -d --build
      - name: Execute core end-to-end stable contract
        env:
          MZ_BOOTSTRAP_TOKEN: stable-e2e-bootstrap-token
        run: bash scripts/stable-e2e.sh
      - name: Execute extended ERP stable contract
        run: bash scripts/stable-e2e-extended.sh
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Execute Chromium offline and storefront journeys
        env:
          MZ_E2E_BASE_URL: http://127.0.0.1
          MZ_E2E_EMAIL: owner.e2e@milyzebra.test
          MZ_E2E_PASSWORD: StableE2E-2026!
        run: |
          set -o pipefail
          npx playwright test e2e/stable-offline.spec.js --reporter=line 2>&1 | tee playwright-output.log
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-chromium-evidence
          path: |
            playwright-output.log
            test-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=500
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  postgres_integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: milyzebra_integrity
          POSTGRES_USER: milyzebra
          POSTGRES_PASSWORD: integrity-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U milyzebra -d milyzebra_integrity"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://milyzebra:integrity-password@127.0.0.1:5432/milyzebra_integrity
      JWT_SECRET: stable-integrity-jwt-secret-at-least-32-characters
      MZ_BOOTSTRAP_TOKEN: stable-integrity-bootstrap-token
      AUTO_CREATE_SCHEMA: 'false'
      MEDIA_ROOT: /tmp/mily-zebra-integrity-media
      OLLAMA_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend test runtime
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Upgrade schema
        working-directory: backend
        run: alembic upgrade head
      - name: Verify integrity schema
        working-directory: backend
        run: |
          alembic current | grep 20260819_0010
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ['DATABASE_URL'])
          inspector = inspect(engine)
          assert 'platform_operators' in inspector.get_table_names()
          assert 'request_hash' in {c['name'] for c in inspector.get_columns('sales')}
          assert 'request_hash' in {c['name'] for c in inspector.get_columns('orders')}
          assert 'request_hash' in {c['name'] for c in inspector.get_columns('return_records')}
          assert 'unit_cost' in {c['name'] for c in inspector.get_columns('sale_lines')}
          assert 'unit_cost' in {c['name'] for c in inspector.get_columns('order_lines')}
          assert 'uq_cash_open_user' in {i['name'] for i in inspector.get_indexes('cash_sessions')}
          assert 'uq_bank_match_target' in {i['name'] for i in inspector.get_indexes('bank_transactions')}
          PY
      - name: Run PostgreSQL concurrency and integrity suite
        working-directory: backend
        run: pytest -q postgres_tests

  upgrade_from_main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: milyzebra_upgrade
          POSTGRES_USER: milyzebra
          POSTGRES_PASSWORD: upgrade-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U milyzebra -d milyzebra_upgrade"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://milyzebra:upgrade-password@127.0.0.1:5432/milyzebra_upgrade
      JWT_SECRET: stable-upgrade-jwt-secret-at-least-32-characters
      MZ_BOOTSTRAP_TOKEN: stable-upgrade-bootstrap-token
      AUTO_CREATE_SCHEMA: 'false'
      MEDIA_ROOT: /tmp/mily-zebra-upgrade-media
      OLLAMA_URL: ''
    steps:
      - name: Checkout current stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: previous
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build database using main exactly as deployed
        working-directory: previous/backend
        run: |
          pip install -e '.[dev]'
          alembic upgrade head
          alembic current | grep 20260818_0009
      - name: Seed real v0.12.0 tenant, owner and economic rows
        working-directory: previous/backend
        run: |
          python - <<'PY'
          from decimal import Decimal
          from app.commerce_models import Order, OrderLine, OrderStatus
          from app.db import SessionLocal
          from app.models import Branch, Product, Sale, SaleLine, Tenant, User, UserRole
          from app.ops_models import Customer
          from app.security import hash_password
          with SessionLocal() as db:
              tenant = Tenant(name='Upgrade Existing Store', slug='upgrade-existing-store')
              db.add(tenant); db.flush()
              branch = Branch(tenant_id=tenant.id, code='UP-01', name='Existing Branch')
              db.add(branch); db.flush()
              owner = User(
                  tenant_id=tenant.id,
                  branch_id=branch.id,
                  email='upgrade.owner@example.com',
                  full_name='Existing Owner',
                  password_hash=hash_password('UpgradeOwner-2026!'),
                  role=UserRole.OWNER,
              )
              db.add(owner); db.flush()
              product = Product(
                  tenant_id=tenant.id,
                  sku='UPGRADE-COST-001',
                  name='Legacy cost product',
                  unit_cost=Decimal('42.50'),
                  sale_price=Decimal('100.00'),
              )
              db.add(product); db.flush()
              sale = Sale(
                  tenant_id=tenant.id,
                  branch_id=branch.id,
                  cashier_user_id=owner.id,
                  idempotency_key='legacy-sale',
                  subtotal=Decimal('100.00'),
                  discount_total=Decimal('0'),
                  tax_total=Decimal('0'),
                  total=Decimal('100.00'),
                  payment_method='cash',
              )
              db.add(sale); db.flush()
              db.add(SaleLine(
                  sale_id=sale.id,
                  product_id=product.id,
                  quantity=Decimal('1'),
                  unit_price=Decimal('100.00'),
                  line_total=Decimal('100.00'),
              ))
              customer = Customer(tenant_id=tenant.id, full_name='Legacy customer')
              db.add(customer); db.flush()
              order = Order(
                  tenant_id=tenant.id,
                  branch_id=branch.id,
                  customer_id=customer.id,
                  idempotency_key='legacy-order',
                  tracking_token_hash='legacy-tracking-hash',
                  status=OrderStatus.PENDING_PAYMENT,
                  subtotal=Decimal('100.00'),
                  total=Decimal('100.00'),
                  fulfillment_method='pickup',
              )
              db.add(order); db.flush()
              db.add(OrderLine(
                  order_id=order.id,
                  product_id=product.id,
                  quantity=Decimal('1'),
                  unit_price=Decimal('100.00'),
                  line_total=Decimal('100.00'),
              ))
              db.commit()
          PY
      - name: Upgrade the same database with candidate
        working-directory: candidate/backend
        run: |
          pip install -e '.[dev]'
          alembic upgrade head
          alembic current | grep 20260819_0010
      - name: Verify migrated production invariants
        working-directory: candidate/backend
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine(os.environ['DATABASE_URL'])
          i = inspect(engine)
          assert 'platform_operators' in i.get_table_names()
          expected_versions = (
              'cash_sessions', 'print_jobs', 'purchase_orders', 'stock_transfers',
              'deliveries', 'orders', 'payments', 'receivables', 'payables',
              'bank_transactions',
          )
          for table in expected_versions:
              assert 'version' in {c['name'] for c in i.get_columns(table)}, table
          for table in ('sales', 'orders', 'return_records'):
              assert 'request_hash' in {c['name'] for c in i.get_columns(table)}, table
          for table in ('sale_lines', 'order_lines'):
              assert 'unit_cost' in {c['name'] for c in i.get_columns(table)}, table
          for table in ('receivable_payments', 'payable_payments'):
              columns = {c['name'] for c in i.get_columns(table)}
              assert {'idempotency_key', 'request_hash'} <= columns, (table, columns)
          assert 'uq_cash_open_user' in {x['name'] for x in i.get_indexes('cash_sessions')}
          assert 'uq_bank_match_target' in {x['name'] for x in i.get_indexes('bank_transactions')}
          with engine.connect() as conn:
              owner_id = conn.execute(text(
                  "SELECT id FROM users WHERE email='upgrade.owner@example.com'"
              )).scalar_one()
              operator_id = conn.execute(text(
                  "SELECT user_id FROM platform_operators WHERE user_id=:owner_id"
              ), {'owner_id': owner_id}).scalar_one()
              assert operator_id == owner_id
              sale_cost = conn.execute(text(
                  "SELECT unit_cost FROM sale_lines LIMIT 1"
              )).scalar_one()
              order_cost = conn.execute(text(
                  "SELECT unit_cost FROM order_lines LIMIT 1"
              )).scalar_one()
              assert Decimal(sale_cost) == Decimal('42.50')
              assert Decimal(order_cost) == Decimal('42.50')
          PY

  installer_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute supported VPS installer
        run: sudo bash ./install.sh
      - name: Verify installed system
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/health | grep -q '"version":"0.12.1"'
          curl -fsS http://127.0.0.1/ | grep -q '<div id="root"></div>'
          curl -fsS http://127.0.0.1/admin | grep -q '<div id="root"></div>'
          sudo docker compose exec -T api alembic current | grep 20260819_0010
          sudo test "$(stat -c '%a' .env)" = '600'
          sudo test "$(stat -c '%a' .bootstrap-token)" = '600'
          ! sudo grep -Eq 'change-this-in-production|change-this-to-a-long-random-secret|change-this-bootstrap-token' .env
      - name: Installer diagnostics
        if: failure()
        run: |
          sudo docker compose ps || true
          sudo docker compose logs --no-color --tail=500 || true
      - name: Stop installed stack
        if: always()
        run: sudo docker compose down -v --remove-orphans || true
