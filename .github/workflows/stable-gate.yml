name: Stable Gate

on:
  push:
    branches:
      - main
      - 'stabilize/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  stable_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated stable environment
        run: |
          cp .env.example .env
          sed -i 's/change-this-in-production/stable-e2e-db-password/g' .env
          sed -i 's/change-this-to-a-long-random-secret/stable-e2e-jwt-secret-at-least-32-chars/g' .env
          sed -i 's/^MZ_SITE_ADDRESS=.*/MZ_SITE_ADDRESS=:80/' .env
      - name: Build and start stable stack
        run: docker compose up -d --build
      - name: Execute end-to-end stable contract
        run: ./scripts/stable-e2e.sh
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=400
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
