name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Test backend
        working-directory: backend
        run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: milyzebra_ci
          POSTGRES_USER: milyzebra
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U milyzebra -d milyzebra_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://milyzebra:ci-password@127.0.0.1:5432/milyzebra_ci
      AUTO_CREATE_SCHEMA: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Upgrade schema
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration state
        working-directory: backend
        run: alembic current | grep 20260818_0009

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/change-this-in-production/ci-compose-password/g' .env
          sed -i 's/change-this-to-a-long-random-secret/ci-jwt-secret-at-least-32-characters/g' .env
          sed -i 's/^MZ_SITE_ADDRESS=.*/MZ_SITE_ADDRESS=:80/' .env
      - name: Build and start complete stack
        run: docker compose up -d --build
      - name: Verify HTTP and services
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1/api/health >/tmp/health.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color --tail=200
              exit 1
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1/ >/tmp/storefront.html
          grep -q '<div id="root"></div>' /tmp/storefront.html
          docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          docker compose exec -T redis redis-cli ping | grep -q PONG
          docker compose exec -T api alembic current | grep 20260818_0009
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q backend/app backend/tests backend/migrations agent desktop
