<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Mily Zebra Commerce OS</title>
  <desc id="desc">Portada editorial rosa, lavanda, blanco y negro para el ERP ecommerce Mily Zebra.</desc>
  <defs>
