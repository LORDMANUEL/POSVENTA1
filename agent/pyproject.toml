[project]
name = "mily-zebra-agent"
version = "0.1.0"
description = "Local hardware agent for Mily Zebra Commerce OS"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1"
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.21.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
